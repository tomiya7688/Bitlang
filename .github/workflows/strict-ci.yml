name: Strict CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: strict-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bitlang-ci:
    name: Bitlang CI (${{ matrix.os }})
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Bitlang CI
        run: go run ./tools/bitlang-ci/cmd/bitlang-ci

  pr-documentation:
    name: Documentation language sync
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check paired documentation changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: go run ./tools/doc-pair-checker/cmd/doc-pair-checker --base "$BASE_SHA"

  race:
    name: Race detector
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Race test
        run: go test -count=1 -race ./...

  coverage:
    name: Coverage smoke
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Coverage
        run: go test -count=1 -covermode=atomic ./...

  cross-build:
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross build Bitlang CLI
        run: go build -trimpath -o "$RUNNER_TEMP/bitlang-${GOOS}-${GOARCH}" ./cmd/bitlang

  strict-gate:
    name: Strict gate
    if: always()
    needs:
      - bitlang-ci
      - pr-documentation
      - race
      - coverage
      - cross-build
    timeout-minutes: 5
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all strict checks
        env:
          BITLANG_CI_RESULT: ${{ needs.bitlang-ci.result }}
          DOCUMENTATION_RESULT: ${{ needs.pr-documentation.result }}
          RACE_RESULT: ${{ needs.race.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
        run: |
          for result in "$BITLANG_CI_RESULT" "$DOCUMENTATION_RESULT" "$RACE_RESULT" "$COVERAGE_RESULT" "$CROSS_BUILD_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Strict check did not pass: $result" >&2; exit 1 ;;
            esac
          done
          echo "OK strict gate"
