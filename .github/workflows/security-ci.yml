name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Go vulnerability reachability
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup scanner Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  gosec:
    name: Go security static analysis
    timeout-minutes: 20
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup scanner Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run gosec
        run: gosec ./...

  lexer-fuzz:
    name: Hostile lexer fuzz smoke
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz lexer
        run: go test ./internal/bitlang -run '^$' -fuzz '^FuzzLexerNeverPanics$' -fuzztime=15s

  secrets:
    name: Secret leak scan
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify dependency manifests
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  workflow-security:
    name: GitHub Actions security
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          version: "1.29.0"
          min-severity: medium
          min-confidence: medium

  workflow-lint:
    name: GitHub Actions syntax lint
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup scanner Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        run: actionlint

  codeql:
    name: CodeQL security-extended
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup project Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  security-gate:
    name: Security gate
    if: always()
    needs:
      - govulncheck
      - gosec
      - lexer-fuzz
      - secrets
      - dependency-review
      - workflow-security
      - workflow-lint
      - codeql
    timeout-minutes: 5
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all security checks
        env:
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
          GOSEC_RESULT: ${{ needs.gosec.result }}
          LEXER_FUZZ_RESULT: ${{ needs.lexer-fuzz.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow-security.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          for result in "$GOVULNCHECK_RESULT" "$GOSEC_RESULT" "$LEXER_FUZZ_RESULT" "$SECRETS_RESULT" "$DEPENDENCY_REVIEW_RESULT" "$WORKFLOW_SECURITY_RESULT" "$WORKFLOW_LINT_RESULT" "$CODEQL_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Security check did not pass: $result" >&2; exit 1 ;;
            esac
          done
          echo "OK security gate"
