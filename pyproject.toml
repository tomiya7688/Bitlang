[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bitlang"
version = "0.0.1"
description = "Reference implementation and tooling for Bitlang"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Bitlang contributors" }
]

[project.scripts]
bitlang = "bitlang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
